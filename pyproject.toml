[project]
name = "log-insights"
version = "1.0.0"
description = "Fast, dependency-free summaries of web server access logs: traffic, status codes, top paths and latency percentiles."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = []

[project.optional-dependencies]
dev = [
    "mypy>=2.4",
    "pytest>=9.0",
    "ruff>=0.17",
]

[project.scripts]
log-insights = "log_insights.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/log_insights"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "PTH"]

[tool.mypy]
strict = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
